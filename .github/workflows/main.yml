name: Deploy Node.js API to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SEVER_PASSWORD }}
          script: |
            echo "Navigating to API directory..."
            cd /var/www/html/1stop/1stopbackend || exit 1

            echo "Pulling latest code from dev branch..."
            git reset --hard
            git clean -fd
            git pull origin dev

            echo "Installing dependencies..."
            echo ${{ toJson(vars) }}
            echo ${{ toJson(secrets) }}
            npm install --production

            echo "Creating production .env file..."
            cat > .env << EOF
            PORT=${{ vars.PORT }}
            DB_HOST=${{ vars.DB_HOST }}
            DB_PORT=${{ vars.DB_PORT }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ vars.DB_PASSWORD }}
            DB_NAME=${{ vars.DB_NAME }}
            JWT_SECRET=${{ vars.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}
            REFRESH_TOKEN_EXPIRES_IN=${{ vars.REFRESH_TOKEN_EXPIRES_IN }}
            NODE_ENV=production
            EOF

            echo "Setting .env file permissions..."
            chmod 600 .env

            echo "Stopping existing API service..."
            pm2 stop api || echo "No running process found"

            echo "Starting API service..."
            pm2 start src/index.js --name api --env production

            echo "Deployment finished!"
