name: Deploy Node.js API to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SEVER_PASSWORD }}
          script: |
            echo "Navigating to API directory..."
            cd /var/www/html/1stop/1stopbackend || exit 1

            echo "Pulling latest code from dev branch..."
            git reset --hard
            git clean -fd
            git pull origin dev

            echo "Installing dependencies..."
            npm install --production

            echo "Creating production .env file..."
            cat > .env << EOF
            PORT=${{ secrets.env.PORT }}
            DB_HOST=${{ secrets.env.DB_HOST }}
            DB_PORT=${{ secrets.env.DB_PORT }}
            DB_USER=${{ secrets.env.DB_USER }}
            DB_PASSWORD=${{ secrets.env.DB_PASSWORD }}
            DB_NAME=${{ secrets.env.DB_NAME }}
            JWT_SECRET=${{ secrets.env.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.env.JWT_EXPIRES_IN }}
            REFRESH_TOKEN_EXPIRES_IN=${{ secrets.env.REFRESH_TOKEN_EXPIRES_IN }}
            NODE_ENV=production
            EOF

            echo "Setting .env file permissions..."
            chmod 600 .env

            echo "Stopping existing API service..."
            pm2 stop api || echo "No running process found"

            echo "Starting API service..."
            pm2 start src/index.js --name api --env production

            echo "Deployment finished!"
